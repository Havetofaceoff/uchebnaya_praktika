<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CRM: Карточка партнера [Добавление]</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
        color: #222;
      }

      .header {
        background-color: white;
        padding: 25px 40px;
        border-bottom: 1px solid #ddd;
      }

      .container {
        max-width: 800px;
        margin: 40px auto;
        background-color: white;
        padding: 35px;
        border: 1px solid #ccc;
      }

      h1 {
        margin-top: 0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
      }

      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #aaa;
      }

      .buttons {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }

      .button {
        padding: 12px 20px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        background-color: #333;
        color: white;
      }

      .back-button {
        background-color: #777;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <h1>CRM: Карточка партнера</h1>
    </header>

    <main class="container">
      <h2>Добавление партнера</h2>

      <form>
        <div class="form-group">
          <label for="name">Наименование</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="partner_type">Тип партнера</label>

          <select id="partner_type" name="partner_type" required>
            <option value="" disabled selected>Выберите тип партнера</option>
            <option value="ООО">ООО</option>
            <option value="ИП">ИП</option>
            <option value="ЗАО">ЗАО</option>
            <option value="ОАО">ОАО</option>
            <option value="ПАО">ПАО</option>
          </select>
        </div>

        <div class="form-group">
          <label for="rating">Рейтинг</label>
          <input
            type="number"
            id="rating"
            name="rating"
            min="0"
            step="1"
            required
          />
        </div>

        <div class="form-group">
          <label for="address">Адрес</label>
          <input type="text" id="address" name="address" required />
        </div>

        <div class="form-group">
          <label for="director">ФИО директора</label>
          <input type="text" id="director" name="director" required />
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+7 (999) 123-45-67"
            title="Введите телефон в формате +7 (999) 123-45-67"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email компании</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="company@example.ru"
            title="Введите email в формате company@example.ru"
            required
          />
        </div>

        <div class="buttons">
          <button type="submit" class="button">Сохранить</button>

          <a href="/" class="button back-button"> Назад </a>
        </div>
      </form>
    </main>
  </body>
</html>
