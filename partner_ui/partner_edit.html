<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CRM: Карточка партнера [Добавление]</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background-color: #f5f5f5;
        color: #222;
      }

      .header {
        background-color: white;
        padding: 25px 40px;
        border-bottom: 1px solid #ddd;
      }

      .container {
        max-width: 800px;
        margin: 40px auto;
        background-color: white;
        padding: 35px;
        border: 1px solid #ccc;
      }

      h1 {
        margin-top: 0;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #aaa;
      }

      .buttons {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }

      .button {
        padding: 12px 20px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        background-color: #333;
        color: white;
      }

      .back-button {
        background-color: #777;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <h1>CRM: Карточка партнера</h1>
    </header>

    <main class="container">
      <h2>Добавление партнера</h2>

      <form>
        <div class="form-group">
          <label for="name">Название партнера</label>
          <input type="text" id="name" name="name" />
        </div>

        <div class="form-group">
          <label for="inn">ИНН</label>
          <input type="text" id="inn" name="inn" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
        </div>

        <div class="form-group">
          <label for="phone">Телефон</label>
          <input type="text" id="phone" name="phone" />
        </div>

        <div class="form-group">
          <label for="legal_address">Юридический адрес</label>
          <input type="text" id="legal_address" name="legal_address" />
        </div>

        <div class="buttons">
          <button type="submit" class="button">Сохранить</button>

          <a href="/" class="button back-button"> Назад </a>
        </div>
      </form>
    </main>
  </body>
</html>
